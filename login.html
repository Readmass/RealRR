
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Iyunga Technical School</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">

        <div>

            <img
                src="image/logo.jpg"
                alt="Iyunga Technical School Logo">

            <h1>Iyunga Technical School</h1>

            <p>Quality Education, Science & Technology</p>

        </div>

    </header>


    <main class="login-page">

        <div class="login-box">

            <h1>Admin Login</h1>

            <p>Login to access admission records</p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
